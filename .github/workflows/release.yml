name: Release template

on:
  push:
    tags:
      - "**"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and package
    if: ${{ !github.event.deleted }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Prepare a clean template snapshot
        run: python3 scripts/release.py prepare

      - name: Compile the template with XeLaTeX and Biber
        uses: xu-cheng/latex-action@6549dc21effb2730855a1281407ecfcececc6c1b # v4
        with:
          root_file: main.tex
          working_directory: .build/release/NKU-Thesis
          texlive_version: "2024"
          os: debian
          latexmk_use_xelatex: true

      - name: Package the template and preview
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/release.py package --tag "$RELEASE_TAG"

      - name: Save release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-assets
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Save build logs on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: latex-build-logs
          path: |
            .build/release/NKU-Thesis/*.log
            .build/release/NKU-Thesis/*.blg
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-assets
          path: dist

      - name: Verify asset checksums
        working-directory: dist
        run: sha256sum --check SHA256SUMS

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view -- "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload --clobber -- "$RELEASE_TAG" dist/*
          else
            gh release create --verify-tag --generate-notes \
              --title "NKU-Thesis $RELEASE_TAG" -- "$RELEASE_TAG" dist/*
          fi
